<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting</title>
    <script>
      var home = location.hostname.endsWith("github.io") ? "/port/" : "/";
      location.replace(home);
    </script>
  </head>
  <body>
    <p><a href="/">Return to portfolio</a></p>
  </body>
</html>
